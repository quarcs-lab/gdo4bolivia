[project]
name = "gdo4bolivia"
version = "0.8.1"
description = "GeoDevelopment Observatory of Bolivia: the data, their builders, the notebooks and the website"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Carlos Mendez"}]
# The observatory's Python package lives in its own repository (quarcs-lab/geo4bolivia).
# It reads the files of this repository and provides the build and validate commands.
dependencies = ["geo4bolivia[all]>=0.8.1"]

[project.urls]
Homepage = "https://quarcs-lab.github.io/gdo4bolivia/"
Repository = "https://github.com/quarcs-lab/gdo4bolivia"
Package = "https://github.com/quarcs-lab/geo4bolivia"

[dependency-groups]
# Libraries the notebooks use besides the package (which brings PySAL, statsmodels and plotly)
analysis = ["matplotlib>=3.7", "seaborn>=0.12", "folium>=0.12", "contextily>=1.4", "splot>=1.1",
            "scikit-learn>=1.3", "xgboost>=2.0", "jupyter>=1.0", "notebook>=7.0", "jupytext>=1.19.1",
            "geometrics>=0.1.3", "expdpy>=0.5.2"]
# openpyxl: the SDG Atlas workbook read by builders/sdg.py
dev = ["openpyxl>=3.1.5", "pytest>=8.0", "pillow>=10"]

[tool.uv]
package = false
default-groups = ["analysis", "dev"]
# As in the package: giddy's Markov code needs a working numba and a recent quantecon,
# and numba 0.62 and llvmlite 0.45 have no wheels for Intel Macs.
constraint-dependencies = [
    "numba>=0.60",
    "numba<0.62; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "llvmlite<0.45; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "quantecon>=0.7",
    "giddy>=2.3.5",
]

# To develop the package and the data together, use a sibling checkout of the package instead of
# the PyPI release (do not commit this): uncomment, then `uv sync`.
# [tool.uv.sources]
# geo4bolivia = { path = "../geo4bolivia", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
