# Spatial scales of the GeoDevelopment Observatory of Bolivia.
#
# Every unit at every scale has a geo ID matching `id_pattern`. Administrative
# IDs are numbered as in GADM 4.1 and nest by prefix: BO > BO-04 (La Paz)
# > BO-04-17 (Murillo) > BO-04-17-04 (Nuestra Señora de La Paz).
#
# Municipal maps are named by their number of units: `map343` is SDSN Bolivia's map of
# December 2025 (343 municipalities and indigenous autonomies of the Atlas de los ODS 2026,
# licensed by SDSN Bolivia under CC BY 4.0), and `map339` the map of 2015 (339 municipalities,
# GeoBolivia via geoBoundaries, public domain), on whose polygons DS4Bolivia computed pop,
# ntl and the embeddings. The 339 municipalities kept their geo IDs in map343 and the four
# units created since were numbered after them, so the two maps share IDs: a dataset's
# metadata names its map (`geo:scale`), and the analysis functions take `map=`.
# Provinces, departments and the country are exact unions of map343; map339's
# municipalities nest in them by ID (their outlines differ slightly). A new municipal map
# is added as its own scale, `map<units>` (see CONTRIBUTING_DATA.md).
#
# `parent` is the next coarser scale a unit nests in (exactly, or by ID only where
# `nesting: ids`). Units of a scale with `parent: null` (grids) are linked to others by
# area-weighted spatial overlay.
#
# status: active  -> units, boundaries and crosswalks are published in geo/
#         planned -> the scale and its ID scheme are reserved; no units yet

country:
  label: Country
  kind: admin
  level: 0
  parent: null
  id_pattern: '^BO$'
  example: BO
  source: union of the SDSN Bolivia 2025 municipalities
  status: active

department:
  label: Department
  kind: admin
  level: 1
  parent: country
  id_pattern: '^BO-\d{2}$'
  example: BO-04            # La Paz (INE code 02)
  digits: 2
  source: union of the SDSN Bolivia 2025 municipalities (numbered as GADM 4.1 level 1)
  status: active

province:
  label: Province
  kind: admin
  level: 2
  parent: department
  id_pattern: '^BO-\d{2}-\d{2}$'
  example: BO-04-17         # Murillo
  digits: 2
  source: union of the SDSN Bolivia 2025 municipalities (numbered as GADM 4.1 level 2, plus BO-03-09 for the Territorio Indígena Multiétnico; 113 provinces)
  status: active

map343:
  label: Municipality (map343, SDSN Bolivia 2025)
  kind: admin
  level: 3
  parent: province
  id_pattern: '^BO-\d{2}-\d{2}-\d{2}$'
  example: BO-04-17-04      # Nuestra Señora de La Paz (seat of government)
  digits: 2
  source: SDSN Bolivia (2025), Límites Municipales Bolivia 2025 (343 municipalities and GAIOC), numbered as GADM 4.1 level 3
    plus four units created after GADM's map
  status: active

map339:
  label: Municipality (map339, 2015 map)
  kind: admin
  level: 3
  parent: province
  id_pattern: '^BO-\d{2}-\d{2}-\d{2}$'
  example: BO-04-17-04      # Nuestra Señora de La Paz
  digits: 2
  source: GeoBolivia's municipal map of 2015 (339 municipalities), via geoBoundaries (gbOpen BOL ADM3, public domain)
    and DS4Bolivia (asdf_id), numbered as GADM 4.1 level 3
  nesting: ids              # in its province by geo ID; its outlines differ slightly from map343's unions
  status: active

grid10k:
  label: 10 km grid cell
  kind: grid
  level: null
  parent: null
  id_pattern: '^BO-G10K-r\d{3}c\d{3}$'
  example: BO-G10K-r012c034
  cell_size_m: 10000
  source: Regular grid in the equal-area projection of project.yaml
  status: planned
