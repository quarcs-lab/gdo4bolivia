# Project identity. See TEMPLATE.md and docs/data-infrastructure.md.
# Everything generic in the package reads its settings from here.

name: GeoDevelopment Observatory of Bolivia
short_name: GDO-Bolivia

# Python package (import name), CLI command and prefix of the environment
# variables (GEO4BOLIVIA_DATA_DIR, GEO4BOLIVIA_BASE_URL, GEO4BOLIVIA_REF).
package: geo4bolivia

# GitHub repository holding the published files, and the git ref an installed
# package reads from by default (a release tag freezes the data).
repository: quarcs-lab/gdo4bolivia
default_ref: main

website: https://quarcs-lab.github.io/gdo4bolivia/

# How to cite the observatory. Every dataset's citations (geo.cite(), the dataset's README,
# its page on the website) list the original sources first, then this, then the other sources.
citation:
  apa: "Mendez, C. (2026). GeoDevelopment Observatory of Bolivia. https://quarcs-lab.github.io/gdo4bolivia/"
  bibtex: |-
    @misc{gdobolivia2026,
      author       = {Mendez, Carlos},
      title        = {{GeoDevelopment Observatory of Bolivia}},
      year         = {2026},
      howpublished = {\url{https://quarcs-lab.github.io/gdo4bolivia/}},
      note         = {Data and code: https://github.com/quarcs-lab/gdo4bolivia}
    }

country:
  name: Bolivia
  iso2: BO     # prefix of every geo_id
  iso3: BOL    # GADM country code (GID_0)

# Equal-area projection for areas, crosswalk weights and overlays.
# An Albers equal-area projection fitted to Bolivia (standard parallels 11°S and 21°S).
equal_area_crs: "+proj=aea +lat_0=-16.5 +lon_0=-64.5 +lat_1=-11 +lat_2=-21 +datum=WGS84 +units=m +no_defs"

# Default view of geo.map() (the package's quick interactive maps).
map:
  center: {lat: -16.3, lon: -64.0}
  zoom: 4

# Generated table listing every variable of every dataset.
catalog: definitions_gdo-bolivia.csv

# Boundaries of each dataset's wide GeoJSON (data/<dataset>/<scale>/<dataset>_wide.geojson), with
# {scale}: lighter outlines for web maps. The wide GeoPackage keeps geo/boundaries/.
wide_geojson_boundaries: "site/data/{scale}.geojson"

# Website maps drawn by scripts/indicator_map.py: a keyless basemap (tiles below the units,
# labels above them) and the colours of the three natural-break classes (Low, Middle, High).
site:
  # Credit printed under every map drawn from geo/boundaries/ or site/data/, by map (scale);
  # `default` for the scales not listed (the departments and the country are unions of map343)
  boundary_credit:
    map343: "SDSN Bolivia (2025), Límites Municipales Bolivia 2025"
    map339: "GeoBolivia (2015), municipal map, via geoBoundaries (public domain)"
    default: "SDSN Bolivia (2025), Límites Municipales Bolivia 2025"
  basemap:
    base: https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}
    labels: https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}
    attribution: "Basemap: Esri, HERE, Garmin, © OpenStreetMap contributors, and the GIS user community"
  colors:
    background: "#071417"
    text: "#e6efee"
    muted: "#a9bebb"
    accent: "#5ad6c6"
    no_data: "#5c6b6a"
    classes: ["#1f8a80", "#ec8f99", "#ffd9de"]
    # The five classes of the interactive maps (low to high), from the site's lagoon-to-flamingo ramp
    ramp: ["#13605f", "#5fb7a6", "#c9e2d6", "#ec8f99", "#d84a64"]
