name: GeoLibre

# "Open in GeoLibre" depends on GeoLibre (https://geolibre.app), a young app that changes fast. Every
# Monday this runs scripts/geolibre_check.py: GeoLibre's project format, ramp and classification code
# (which site/geolibre.mjs ports), the live site's projects and data, and GeoLibre's Python package
# opening every project. A failure (GitHub emails it) says what changed and what to update.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

# Read-only: the check changes nothing. Actions are pinned to commit SHAs (tag in the comment).
permissions:
  contents: read

jobs:
  check:
    name: Check the GeoLibre integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Check
        run: uv run --no-project --python 3.12 --with geolibre python scripts/geolibre_check.py
